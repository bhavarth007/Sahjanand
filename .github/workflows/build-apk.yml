name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Create Android project and get deps
        working-directory: flutter_app
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          flutter create --platforms android --org com.sahjanand --project-name sahjanand .
          cp pubspec.yaml.bak pubspec.yaml
          
          # Copy native MainActivity with audio recording
          mkdir -p android/app/src/main/kotlin/com/sahjanand/sahjanand
          cp native/MainActivity.kt android/app/src/main/kotlin/com/sahjanand/sahjanand/MainActivity.kt
          
          # Set app label
          sed -i 's/android:label="sahjanand"/android:label="Sahjanand"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="sahjanand"/android:label="Sahjanand"/' android/app/src/debug/AndroidManifest.xml || true
          sed -i 's/android:label="sahjanand"/android:label="Sahjanand"/' android/app/src/profile/AndroidManifest.xml || true
          
          # Add permissions
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.VIBRATE"\/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"\/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"\/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"\/>' android/app/src/main/AndroidManifest.xml
          
          # Enable cleartext + hardware acceleration
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/' android/app/src/main/AndroidManifest.xml
          
          # Add FCM metadata inside <application> before closing tag
          sed -i '/<\/application>/i \        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="sahjanand_reminders" \/>\n        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@mipmap\/ic_launcher" \/>' android/app/src/main/AndroidManifest.xml
          
          # Set minSdk to 23 in app/build.gradle ONLY for the app module (not plugins)
          sed -i '/defaultConfig {/,/}/ s/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle
          sed -i '/defaultConfig {/,/}/ s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          
          # Add Google Services plugin to app/build.gradle
          sed -i '/id "dev.flutter.flutter-gradle-plugin"/a \    id "com.google.gms.google-services"' android/app/build.gradle
          
          # Add Google Services plugin to settings.gradle
          sed -i '/id "org.jetbrains.kotlin.android"/a \    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle
          
          # Copy placeholder google-services.json
          cp android/app/google-services.json android/app/google-services.json 2>/dev/null || true
          if [ ! -f android/app/google-services.json ]; then
            cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "sahjanand-placeholder",
              "storage_bucket": "sahjanand-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": { "package_name": "com.sahjanand.sahjanand" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          EOF
          fi
          
          # Set compileSdk via local.properties (accessible by all plugins via flutter.compileSdkVersion)
          echo "flutter.compileSdkVersion=35" >> android/local.properties
          echo "flutter.minSdkVersion=23" >> android/local.properties
          echo "flutter.targetSdkVersion=35" >> android/local.properties
          
          # App icon
          cp assets/icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp assets/icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          
          rm -f pubspec.lock
          flutter pub get

      - name: Build APK
        working-directory: flutter_app
        run: flutter build apk --debug --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahjanand-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sahjanand v1.0.${{ github.run_number }}
          body: |
            Download and install this APK on your Android phone.
          files: |
            flutter_app/build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
            flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
