name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Create Android project and get deps
        working-directory: flutter_app
        run: |
          # Backup our pubspec before flutter create overwrites it
          cp pubspec.yaml pubspec.yaml.bak
          
          flutter create --platforms android --org com.sahjanand --project-name sahjanand .
          
          # Restore our original pubspec with correct dependencies
          cp pubspec.yaml.bak pubspec.yaml
          
          # Copy our custom MainActivity with audio recording support
          mkdir -p android/app/src/main/kotlin/com/sahjanand/sahjanand
          cp native/MainActivity.kt android/app/src/main/kotlin/com/sahjanand/sahjanand/MainActivity.kt
          
          # Set app display name to "Sahjanand"
          sed -i 's/android:label="sahjanand"/android:label="Sahjanand"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="sahjanand"/android:label="Sahjanand"/' android/app/src/debug/AndroidManifest.xml || true
          sed -i 's/android:label="sahjanand"/android:label="Sahjanand"/' android/app/src/profile/AndroidManifest.xml || true
          # Add all permissions
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.VIBRATE"\/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"\/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"\/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"\/>' android/app/src/main/AndroidManifest.xml
          # Enable cleartext traffic and hardware acceleration
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/' android/app/src/main/AndroidManifest.xml
          # Set compileSdk and minSdk
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/' android/app/build.gradle
          # Copy company logo as app icon
          cp assets/icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp assets/icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          # Clean resolve
          rm -f pubspec.lock
          flutter pub get

      - name: Build APK
        working-directory: flutter_app
        run: flutter build apk --debug --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahjanand-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sahjanand v1.0.${{ github.run_number }}
          body: |
            Download and install this APK on your Android phone.
            The app connects to the live server - updates happen automatically.
          files: |
            flutter_app/build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
            flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
