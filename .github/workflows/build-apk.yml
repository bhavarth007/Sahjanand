name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install Android SDK Platform 35
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35"

      - name: Create Android project and get deps
        working-directory: flutter_app
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          flutter create --platforms android --org com.sahjanand --project-name sahjanand .
          cp pubspec.yaml.bak pubspec.yaml
          
          # Copy native MainActivity with audio recording
          mkdir -p android/app/src/main/kotlin/com/sahjanand/sahjanand
          cp native/MainActivity.kt android/app/src/main/kotlin/com/sahjanand/sahjanand/MainActivity.kt
          
          # ── Write complete AndroidManifest.xml (replaces generated one) ──
          cat > android/app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <application
                  android:label="Sahjanand"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name="com.google.firebase.messaging.FirebaseMessagingService"
                      android:exported="false"
                      android:stopWithTask="false">
                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT" />
                      </intent-filter>
                  </service>
                  <receiver
                      android:name="com.google.firebase.iid.FirebaseInstanceIdReceiver"
                      android:exported="true"
                      android:permission="com.google.android.c2dm.permission.SEND">
                      <intent-filter>
                          <action android:name="com.google.android.c2dm.intent.RECEIVE" />
                      </intent-filter>
                  </receiver>
                  <!-- Android Alarm Manager — for reliable reminder delivery as backup -->
                  <service
                      android:name="dev.fluttercommunity.plus.androidalarmmanager.AlarmService"
                      android:permission="android.permission.BIND_JOB_SERVICE"
                      android:exported="false" />
                  <receiver
                      android:name="dev.fluttercommunity.plus.androidalarmmanager.AlarmBroadcastReceiver"
                      android:exported="false" />
                  <receiver
                      android:name="dev.fluttercommunity.plus.androidalarmmanager.RebootBroadcastReceiver"
                      android:enabled="true"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
                  <meta-data
                      android:name="com.google.firebase.messaging.default_notification_channel_id"
                      android:value="sahjanand_reminders" />
                  <meta-data
                      android:name="com.google.firebase.messaging.default_notification_icon"
                      android:resource="@mipmap/ic_launcher" />
                  <meta-data
                      android:name="firebase_messaging_auto_init_enabled"
                      android:value="true" />
              </application>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT" />
                      <data android:mimeType="text/plain" />
                  </intent>
              </queries>
          </manifest>
          MANIFEST
          
          # ── Write settings.gradle with correct modern versions ──
          cat > android/settings.gradle << 'SETTINGS'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.1.0" apply false
              id "org.jetbrains.kotlin.android" version "1.9.0" apply false
              id "com.google.gms.google-services" version "4.4.2" apply false
          }

          include ":app"
          SETTINGS
          
          # ── Write app/build.gradle with Firebase plugin ──
          cat > android/app/build.gradle << 'BUILDGRADLE'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "com.google.gms.google-services"
              id "dev.flutter.flutter-gradle-plugin"
          }
          
          android {
              namespace = "com.sahjanand.sahjanand"
              compileSdk = 35
              ndkVersion = flutter.ndkVersion
          
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }
          
              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_1_8
              }
          
              defaultConfig {
                  applicationId = "com.sahjanand.sahjanand"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }
          
              buildTypes {
                  release {
                      signingConfig = signingConfigs.debug
                  }
              }
          }
          
          flutter {
              source = "../.."
          }
          BUILDGRADLE
          
          # ── Write gradle.properties for compatibility ──
          cat > android/gradle.properties << 'PROPS'
          org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.enableJetifier=true
          PROPS
          
          # ── Write gradle-wrapper.properties with Gradle 8.x (required by AGP 8.1) ──
          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'WRAPPER'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          WRAPPER
          
          # ── Write google-services.json placeholder ──
          cat > android/app/google-services.json << 'GSJSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "sahjanand-placeholder",
              "storage_bucket": "sahjanand-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": { "package_name": "com.sahjanand.sahjanand" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          GSJSON
          
          # ── App icon ──
          cp assets/icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp assets/icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          
          # ── Notification sounds ──
          mkdir -p android/app/src/main/res/raw
          cp assets/alarm_tone.wav android/app/src/main/res/raw/alarm_tone.wav
          cp assets/chat_tone.wav android/app/src/main/res/raw/chat_tone.wav
          
          rm -f pubspec.lock
          flutter pub get

      - name: Build APK
        working-directory: flutter_app
        run: flutter build apk --debug --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahjanand-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sahjanand v1.0.${{ github.run_number }}
          body: |
            Download and install this APK on your Android phone.
          files: |
            flutter_app/build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
            flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
