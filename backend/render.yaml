services:
  - type: web
    name: sahjanand-api
    env: python
    region: singapore         # closest to India
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sahjanand-db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://sahjanand.onrender.com
      - key: PRODUCTION_URL
        value: https://sahjanand-api.onrender.com
      - key: PYTHON_VERSION
        value: "3.12.0"

databases:
  - name: sahjanand-db
    plan: free
    region: singapore
    databaseName: sahjanand
    user: sahjanand
