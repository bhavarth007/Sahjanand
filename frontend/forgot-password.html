<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Sahjanand</title>
  <link rel="icon" type="image/png" href="/assets/images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/css/login.css" />
  <style>
    .forgot-card {
      width: 100%; max-width: 420px;
      text-align: center;
    }
    .forgot-icon {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #FFF0EE, #FFD6CE);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      font-size: 1.8rem;
      color: var(--primary);
    }
    .back-to-login {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--primary); text-decoration: none;
      font-size: 0.9rem; font-weight: 500;
      margin-top: 20px;
    }
    .back-to-login:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="login-page">
  <aside class="login-hero">
    <img data-logo src="/assets/images/logo.png" alt="Sahjanand Logo" class="hero-logo" style="width:350px;height:350px;" />
  </aside>

  <main class="login-form-panel">
    <div class="forgot-card">
      <img data-logo src="/assets/images/logo.png" alt="Sahjanand Logo" class="mobile-logo" />

      <div class="forgot-icon">
        <i class="fa-solid fa-key"></i>
      </div>

      <div class="form-header">
        <h1>Forgot <span>Password?</span></h1>
        <p>Enter your email and we'll send you a reset link.</p>
      </div>

      <div class="alert alert-success" id="successAlert" role="alert">
        <i class="fa-solid fa-circle-check"></i>
        <span>Reset link sent! Check your inbox.</span>
      </div>

      <div class="alert alert-error" id="errorAlert" role="alert">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="errorMsg">Something went wrong. Please try again.</span>
      </div>

      <form id="forgotForm" novalidate>
        <div class="form-group" id="emailGroup">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input
              type="email"
              id="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
          </div>
          <span class="form-error" id="emailError">Please enter a valid email address.</span>
        </div>

        <button type="submit" class="btn-login" id="submitBtn">
          <span class="btn-text">
            <i class="fa-solid fa-paper-plane"></i> Send Reset Link
          </span>
          <span class="btn-spinner"></span>
        </button>
      </form>

      <a href="/login" class="back-to-login">
        <i class="fa-solid fa-arrow-left"></i> Back to Sign In
      </a>
    </div>
  </main>
</div>

<script>
  const API = 'http://localhost:8000';

  document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const emailGroup = document.getElementById('emailGroup');
    const btn = document.getElementById('submitBtn');

    emailGroup.classList.remove('has-error');
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      emailGroup.classList.add('has-error');
      return;
    }

    btn.classList.add('loading');
    try {
      const res = await fetch(`${API}/api/auth/forgot-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      document.getElementById('successAlert').classList.add('show');
      document.getElementById('errorAlert').classList.remove('show');
      document.getElementById('forgotForm').reset();
    } catch {
      document.getElementById('errorAlert').classList.add('show');
    } finally {
      btn.classList.remove('loading');
    }
  });
</script>
</body>
</html>
