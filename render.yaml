    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: postgresql+asyncpg://postgres.zvutmajpsebvqdsshfhq:Bhavarth%400903@aws-0-ap-south-1.pooler.supabase.com:5432/postgres
      - key: SUPABASE_URL
        value: https://zvutmajpsebvqdsshfhq.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://sahjanand-api.onrender.com
